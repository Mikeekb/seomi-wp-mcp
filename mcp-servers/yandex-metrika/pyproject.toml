[project]
name = "seomi-metrika-mcp"
version = "0.1.0"
description = "MCP-сервер для Яндекс.Метрики: Management (цели, сегменты) + Reporting API, чтение и запись"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
seomi-metrika-mcp = "seomi_metrika.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seomi_metrika"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
